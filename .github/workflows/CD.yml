name: CD 🚀
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-sdist:
    name: 🐍 Packaging
    uses: $/.github/workflows/python-packaging-sdist.yml
    permissions:
      contents: read

  # Builds wheels on all supported platforms using cibuildwheel.
  # The wheels are uploaded as GitHub artifacts `dev-cibw-*` or `cibw-*`, depending on whether
  # the workflow is triggered from a PR or a release, respectively.
  build-wheel:
    name: 🐍 Packaging
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: $/.github/workflows/python-packaging-cibuildwheel.yml
    with:
      runs-on: ${{ matrix.runs-on }}
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}
    permissions:
      contents: read

  # Downloads the previously generated artifacts and deploys to PyPI on published releases.
  deploy:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iqm-qdmi
    needs: [build-sdist, build-wheel]
    permissions:
      attestations: write # Needed to attest the built artifacts
      contents: read
      id-token: write # Needed to attest and to publish to PyPI
    steps:
      # Staging sets SOURCE_SHA only after verifying all SDK assets.
      - name: Check C++ SDK assets before publishing to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
            --pattern '*.tar.gz' --pattern SHA256SUMS --pattern SOURCE_SHA
          test "$(cat "$release_dir/SOURCE_SHA")" = "$GITHUB_SHA"
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu arm64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            archive="iqm-qdmi-device_${RELEASE_TAG}_${triple}.tar.gz"
            test -f "$release_dir/$archive"
            awk -v name="$archive" '$2 == name {found++} END {exit found == 1 ? 0 : 1}' "$release_dir/SHA256SUMS"
          done
          test "$(find "$release_dir" -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5
          (
            cd "$release_dir"
            test "$(wc -l < SHA256SUMS)" -eq 5
            sha256sum -c SHA256SUMS
          )
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation for sdist and wheel(s)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
