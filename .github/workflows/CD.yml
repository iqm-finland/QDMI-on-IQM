name: CD 🚀
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  check-release:
    name: 🔍 Check release
    permissions:
      contents: read
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check branch and project version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(uv version --short)
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release requires a stable X.Y.Z version on main." >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" != "$version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match project version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          matrix=$(jq -c '{include: [.platforms | keys[] | {"runs-on": .}]}' .github/cpp-sdk.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-sdist:
    name: 📦 Build source distribution
    needs: check-release
    permissions:
      contents: read
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9

  build-wheel:
    name: 📦 Build wheels
    needs: check-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-release.outputs.matrix) }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ${{ matrix.runs-on }}

  build-cpp-sdk:
    name: 📦 Assemble C++ SDK
    needs: [check-release, build-wheel]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-release.outputs.matrix) }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-sdk.yml@fb4a2de7a53c6b60ec26709cf7c4e50f6a44687b # codex/add-cpp-sdk-packaging
    with:
      runs-on: ${{ matrix.runs-on }}

  publish-release:
    name: 🚀 Publish GitHub release
    needs: [check-release, build-sdist, build-cpp-sdk]
    permissions:
      contents: write
    runs-on: ubuntu-slim
    env:
      RELEASE_TAG: v${{ needs.check-release.outputs.version }}
    steps:
      - name: Check for an existing release
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: `refs/tags/${tag}`,
              });
              if (commit.sha !== context.sha) {
                throw new Error('Release tag points to a different commit.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag,
              });
              if (!data.draft) return true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: previous } = await github.rest.repos.getLatestRelease(context.repo);
            core.setOutput('previous-tag', previous.tag_name);
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              previous_tag_name: previous.tag_name,
            });
            const contributors = notes.body
              .split('## New Contributors\n')[1]
              ?.split('\n**Full Changelog**:')[0].trim();
            core.setOutput('new-contributors', contributors || '* No new contributors');
            return false;

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.existing.outputs.result != 'true'
        with:
          pattern: cpp-sdk-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: steps.existing.outputs.result != 'true'
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Create release token
        if: steps.existing.outputs.result != 'true'
        id: create-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Attach archives and publish
        if: steps.existing.outputs.result != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ steps.create-token.outputs.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: QDMI on IQM ${{ needs.check-release.outputs.version }} Release
          body: |
            ## 👀 What Changed

            _Please refer to the [changelog](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md) for a structured overview of the changes._

            ## 🤝 New Contributors

            ${{ steps.existing.outputs.new-contributors }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.existing.outputs.previous-tag }}...${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  deploy:
    name: 🚀 Publish to PyPI
    needs: [build-sdist, build-wheel, publish-release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iqm-qdmi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
