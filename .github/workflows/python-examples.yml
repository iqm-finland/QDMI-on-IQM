name: 🐍 • End-to-End Examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  examples:
    name: 🐍 ubuntu-26.04
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Temporary: remove after replacing the Core source pin with a release.
      - name: Set up LLVM/MLIR for source-built MQT Core
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: 23.1.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Run end-user examples on the simulator
        run: uvx nox -s examples -- --backend sim
