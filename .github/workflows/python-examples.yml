name: 🐍 • End-to-End Examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  examples:
    name: 🐍 ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      # `mqt-core` is pinned to a git reference, so it is built from source and
      # needs MLIR. Drop this once MQT Core v4 ships and the pin is a version.
      - name: Set up MLIR
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: 22.1.8

      - name: Run end-user examples on the simulator
        run: uvx nox -s examples -- --backend sim
