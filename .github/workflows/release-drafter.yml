name: Release Drafter

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update_release_draft:
    name: Run
    permissions:
      contents: write
    runs-on: ubuntu-slim
    concurrency:
      group: release-draft
      cancel-in-progress: false
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
