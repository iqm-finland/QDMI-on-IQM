name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🔍 Change
    with:
      additional-cpp-files: |
        .github/workflows/cpp-*.yml
        .github/workflows/reusable-live-tests.yml
      additional-python-files: |
        .github/workflows/reusable-live-tests.yml
        .github/workflows/python-*.yml
        .github/workflows/slurm.yml
        examples/**

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
        preset:
          - release
        include:
          - runs-on: windows-2025
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6

  cpp-sanitizers:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    with:
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    permissions:
      contents: read
      id-token: write

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    with:
      clang-version: 23
      files-changed-only: true
      # Preserve C mode for the install consumer; C++ uses the compilation database.
      cpp-linter-extra-args: "-Wunused-template"
    permissions:
      contents: read
      pull-requests: write

  python-tests:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums"]'
      draft-sessions: '["tests-3.15", "minimums-3.15"]'

  python-coverage:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write

  python-examples:
    name: 🐍 Examples
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: $/.github/workflows/python-examples.yml

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    with:
      enable-ty: true
      enable-mypy: false

  cpp-install-tests:
    name: 📦 Native installation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  build-sdist:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)

  build-wheel:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@ae2d91d2b75355d005248c8e14af18a074fe3bb2 # v2.5.6
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    with:
      runs-on: ${{ matrix.runs-on }}

  documentation:
    name: 📚 Documentation
    uses: $/.github/workflows/documentation.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  live-tests:
    name: ☁️ Live tests
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - python-tests
      - build-wheel
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: $/.github/workflows/reusable-live-tests.yml
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-coverage
      - python-examples
      - python-linter
      - cpp-install-tests
      - build-sdist
      - build-wheel
      - documentation
      - live-tests
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-sanitizers,cpp-install-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,python-examples,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel,' || ''
            }}
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name != github.repository
              && 'live-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
