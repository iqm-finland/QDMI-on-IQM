name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner image to test on"
        default: "ubuntu-24.04"
        type: string
    secrets:
      IQM_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-packaging-cibw-${{ inputs.runs-on }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheel:
    name: 🎡 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # `mqt-core` is pinned to a git reference, so the test environment builds
      # it from source and needs MLIR. Linux runs its tests inside the manylinux
      # container, which installs MLIR itself through `before-all` in
      # `pyproject.toml`. Drop this once MQT Core v4 ships and the pin is a
      # released version.
      - name: Set up MLIR
        if: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: munich-quantum-software/setup-mlir@fc08baf0a172e98008e6528d465de3b5dd99bc68 # v1.4.1
        with:
          llvm-version: 22.1.7

      # run cibuildwheel to build wheels for the specified Python version
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          IQM_BASE_URL: "https://resonance.iqm.tech"
          IQM_QC_ALIAS: "emerald:mock"
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
          IQM_CPP_API_LOG_LEVEL: "DEBUG"

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      # upload the wheels as an artifact (adds a `dev-` prefix for PRs)
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse/*.whl
