name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
    with:
      additional-cpp-files: |
        .github/workflows/CI.yml
        .github/workflows/cpp-tests-*.yml
        .github/workflows/cpp-coverage.yml
        .github/workflows/cpp-linter.yml
        .github/workflows/cpp-install-tests.yml
        .github/workflows/cpp-sanitizers.yml
      additional-python-files: |
        .github/workflows/CI.yml
        .github/workflows/python-*.yml
      additional-cd-files: |
        spank/**
        .github/workflows/spank-tests.yml

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, ubuntu-26.04-arm]
        config: [Release]
        iqm-qc-alias: ["emerald:mock"]
        include:
          - runs-on: ubuntu-26.04
            config: Debug
            iqm-qc-alias: "emerald:mock"
          - runs-on: ubuntu-26.04
            config: Release
            iqm-qc-alias: "garnet:mock"
          - runs-on: ubuntu-26.04
            config: Release
            iqm-qc-alias: "sirius:mock"
    uses: $/.github/workflows/cpp-tests-ubuntu.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}
      iqm-qc-alias: ${{ matrix.iqm-qc-alias }}
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26]
        config: [Release]
        iqm-qc-alias: ["emerald:mock"]
        include:
          - runs-on: macos-26
            config: Debug
            iqm-qc-alias: "emerald:mock"
    uses: $/.github/workflows/cpp-tests-macos.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}
      iqm-qc-alias: ${{ matrix.iqm-qc-alias }}
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [windows-2025, windows-11-arm]
        config: [Release]
        compiler: [MSVC]
        iqm-qc-alias: ["emerald:mock"]
        include:
          - runs-on: windows-2025
            config: Debug
            compiler: MSVC
            iqm-qc-alias: "emerald:mock"
          - runs-on: windows-2025
            config: Release
            compiler: ClangCL
            iqm-qc-alias: "emerald:mock"
    uses: $/.github/workflows/cpp-tests-windows.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      config: ${{ matrix.config }}
      compiler: ${{ matrix.compiler }}
      iqm-qc-alias: ${{ matrix.iqm-qc-alias }}
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-install-tests:
    name: 📦 Install
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-26.04, macos-26, windows-2025]
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-sanitizers.yml
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: $/.github/workflows/cpp-coverage.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: $/.github/workflows/cpp-linter.yml
    with:
      clang-version: 22
      files-changed-only: true
      cpp-linter-extra-args: "-std=c++20"
    permissions:
      contents: read
      pull-requests: write # required to post comments on PRs

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@ace7363a2a8e036e5efc6717be67f1eda29a120e # v2.4.2
    with:
      check-stubs: false
      enable-ty: true
      enable-mypy: false

  examples:
    name: 🐍 End-to-End Examples
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: $/.github/workflows/python-examples.yml

  build-sdist:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: $/.github/workflows/python-packaging-sdist.yml

  iqm-tests:
    name: 🐍 Resonance (emerald:mock)
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cpp-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Test the Resonance mock
        timeout-minutes: 10
        run: uvx nox --non-interactive -s tests-3.14 -- -m iqm -n 0 -x
        env:
          IQM_BASE_URL: "https://resonance.iqm.tech"
          IQM_QC_ALIAS: "emerald:mock"
          IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  build-wheel:
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    uses: $/.github/workflows/python-packaging-cibuildwheel.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  spank-tests:
    name: 🇸 Test SPANK
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: $/.github/workflows/spank-tests.yml
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  # this job does nothing and is only used for branch protection
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-install-tests
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-linter
      - examples
      - iqm-tests
      - build-sdist
      - build-wheel
      - spank-tests
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-install-tests,cpp-sanitizers,cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'examples,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests) && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-sdist,build-wheel,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests) && !fromJSON(needs.change-detection.outputs.run-cpp-tests) && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'iqm-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests) && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'spank-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
