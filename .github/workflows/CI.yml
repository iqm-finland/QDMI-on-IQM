name: CI
on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  change-detection:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🔍 Change
    with:
      additional-cpp-files: |
        CMakePresets.json
        .github/workflows/**
      additional-python-files: |
        .github/workflows/**
        test/fixtures/**
      additional-cd-files: |
        .github/workflows/**
        CMakeLists.txt
        cmake/**
        python/**
        src/**
        include/**
        pyproject.toml
        uv.lock
        LICENSE
        README.md

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@a4b4977405c7685f95e127cdb6db396bbadce787

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@a4b4977405c7685f95e127cdb6db396bbadce787

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
          - windows-11-arm
        preset:
          - release
        include:
          - runs-on: windows-2025
            preset: debug
            compiler: MSVC
          - runs-on: windows-2025
            preset: release
            compiler: ClangCL
        compiler:
          - MSVC
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}
      config: ${{ matrix.preset == 'debug' && 'Debug' || 'Release' }}
    uses: $/.github/workflows/cpp-tests-windows.yml

  cpp-sanitizers:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    with:
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  cpp-coverage:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    permissions:
      contents: read
      id-token: write

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    with:
      clang-version: 22
      files-changed-only: true
      cpp-linter-extra-args: "-std=c++20"
      cpp-linter-ignore-extra: "!include/**"
    permissions:
      contents: read
      pull-requests: write # required to post comments on PRs

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@a4b4977405c7685f95e127cdb6db396bbadce787 # v2.5.5
    with:
      enable-ty: true
      enable-mypy: false

  python-tests:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums"]'
      draft-sessions: '["tests-3.14", "minimums-3.14"]'

  python-coverage:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write

  examples:
    name: 🧪 Local examples
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: $/.github/workflows/python-examples.yml

  build-sdist:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)

  build-wheel:
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@a4b4977405c7685f95e127cdb6db396bbadce787
    name: 🚀 CD
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
          - windows-11-arm
    with:
      runs-on: ${{ matrix.runs-on }}

  documentation:
    name: 📚 Documentation
    uses: $/.github/workflows/documentation.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  live-tests:
    name: ☁️ Live tests
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - python-tests
      - build-wheel
    if:
      always() && !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) && (needs.change-detection.outputs.run-cpp-tests == 'true' ||
      needs.change-detection.outputs.run-python-tests == 'true' || needs.change-detection.outputs.run-cd == 'true')
    uses: $/.github/workflows/reusable-live-tests.yml
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-linter
      - python-tests
      - python-coverage
      - examples
      - build-sdist
      - build-wheel
      - documentation
      - live-tests
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35
        with:
          allowed-skips:
            ${{ needs.change-detection.outputs.run-cpp-tests == 'false' &&
            'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-sanitizers,cpp-coverage,' || '' }} ${{ needs.change-detection.outputs.run-cpp-linter
            == 'false' && 'cpp-linter,' || '' }} ${{ needs.change-detection.outputs.run-python-linter == 'false' && 'python-linter,' || '' }} ${{
            needs.change-detection.outputs.run-python-tests == 'false' && 'python-tests,python-coverage,examples,' || '' }} ${{
            needs.change-detection.outputs.run-python-tests == 'false' && needs.change-detection.outputs.run-cd == 'false' && 'build-sdist,build-wheel,'
            || '' }} ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository ||
            needs.change-detection.outputs.run-cpp-tests == 'false' && needs.change-detection.outputs.run-python-tests == 'false' &&
            needs.change-detection.outputs.run-cd == 'false') && 'live-tests,' || '' }}
          jobs: ${{ toJSON(needs) }}
