name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    name: 🔍 Change
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      additional-cpp-files: |
        .github/workflows/CI.yml
        .github/workflows/live-tests.yml
      additional-python-files: |
        .github/workflows/CI.yml
        .github/workflows/live-tests.yml
        .github/workflows/python-*.yml
        examples/**
      additional-cd-files: |
        .github/workflows/CI.yml
        .github/workflows/CD.yml
        .github/cpp-sdk.json

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
          - windows-11-arm
        preset:
          - release
        include:
          - runs-on: windows-2025
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    permissions:
      contents: read
      id-token: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9

  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  cpp-install-tests:
    name: 📦 C++ installation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-install-tests.yml@d4d04564988a7d3c4a3ebf6a1f2c88ae73e5ab0c # codex/add-cpp-install-tests
    with:
      runs-on: ${{ matrix.runs-on }}
      apt-packages: libssl-dev zlib1g-dev

  build-cpp-sdk:
    name: 📦 Assemble C++ SDK
    needs: [change-detection, build-wheel]
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
          - windows-11-arm
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-sdk.yml@57e07b7c19b9faa56e8ac2dfd94f15de4d7904eb # codex/add-cpp-sdk-packaging
    with:
      runs-on: ${{ matrix.runs-on }}

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    permissions:
      contents: read
      pull-requests: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      clang-version: 23
      files-changed-only: true
      cpp-linter-extra-args: "-Wunused-template"
      cpp-linter-ignore-extra: "test/install_consumer/**"

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums"]'
      draft-sessions: '["tests-3.15", "minimums-3.15"]'

  python-coverage:
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9

  python-examples:
    name: 🐍 Examples
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: $/.github/workflows/python-examples.yml

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      enable-ty: true
      enable-mypy: false

  build-sdist:
    name: 📦 Build source distribution
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-sdist.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9

  build-wheel:
    name: 📦 Build wheels
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
          - windows-11-arm
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-wheel-cibuildwheel.yml@d6345b25f19cb7223ac883e5333ae9d63ae9238b # v2.5.9
    with:
      runs-on: ${{ matrix.runs-on }}

  documentation:
    name: 📚 Documentation
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/documentation.yml

  live-tests:
    name: ☁️ Live tests
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - python-tests
      - build-wheel
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: $/.github/workflows/live-tests.yml
    secrets:
      IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

  required-checks-pass:
    name: 🚦 Check
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-coverage
      - cpp-sanitizers
      - cpp-install-tests
      - build-cpp-sdk
      - cpp-linter
      - python-tests
      - python-coverage
      - python-examples
      - python-linter
      - build-sdist
      - build-wheel
      - documentation
      - live-tests
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-coverage,cpp-sanitizers,cpp-install-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,python-examples,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'build-cpp-sdk,build-sdist,build-wheel,' || ''
            }}
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name != github.repository
              && 'live-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
