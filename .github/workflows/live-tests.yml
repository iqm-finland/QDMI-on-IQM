name: ☁️ Live tests
on:
  workflow_call:
    inputs:
      run-iteration-test:
        description: Run the iteration lifecycle check after the live tests.
        type: boolean
        default: true
      iqm-qc-aliases:
        description: JSON array of IQM quantum computer aliases to test.
        type: string
        default: '["emerald:mock", "garnet:mock", "sirius:mock"]'
    secrets:
      IQM_TOKEN:
        required: true
permissions:
  contents: read

jobs:
  integration:
    name: ☁️ Live tests · IQM · ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.iqm-qc-aliases) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Build IQM device
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 4

      - name: C++ live tests
        env: &iqm-live
          IQM_SERVER_URL: https://resonance.iqm.tech
          IQM_QUANTUM_COMPUTER: ${{ matrix.backend }}
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
        run: ctest --test-dir build/release -L live --output-on-failure --timeout 600 --parallel 1

      - name: Python live tests
        if: matrix.backend != 'sirius:mock'
        env: *iqm-live
        run: uvx nox -s live-tests

      - name: Python resonator mock tests
        if: matrix.backend == 'sirius:mock'
        env: *iqm-live
        run: >-
          uvx nox -s live-tests -- test/python/test_device_capabilities.py
          test/python/test_qiskit_backend.py
          -k 'device_advertises_exactly_its_supported_formats or device_reports_queue_length or native_compilation_on_mock'

  installation:
    name: ☁️ Live C++ installation · IQM mock · ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      - name: Enable long paths on Windows and Git
        if: runner.os == 'Windows'
        run: |
          reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f
          git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: Chocobo1/setup-ccache-action@ccc034167d57f9a0f3248c21b633819fcf331757 # v1.5.11
        with:
          prepend_symlinks_to_path: false
          override_cache_key: c++-tests-install-${{ matrix.runs-on }}
          windows_compile_environment: msvc

      - name: Set up mold as linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Configure CMake for QDMI
        run: cmake -S . -B install-build -DCMAKE_BUILD_TYPE=Release -DBUILD_IQM_QDMI_TESTS=OFF

      - name: Build QDMI
        run: cmake --build install-build --config Release --target iqm-qdmi-device

      - name: Install QDMI Runtime Component
        run: >
          cmake --install install-build --config Release
          --prefix install-dir
          --component iqm-qdmi-device_Runtime

      - name: Install QDMI Development Component
        run: >
          cmake --install install-build --config Release
          --prefix install-dir
          --component iqm-qdmi-device_Development

      - name: Configure tests with the installed library
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUSE_INSTALLED_IQM_QDMI_DEVICE=ON
          -DCMAKE_PREFIX_PATH=install-dir

      - name: Build tests
        run: cmake --build build --config Release

      - name: Test
        env:
          IQM_QUANTUM_COMPUTER: "emerald:mock"
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
          IQM_LOG_LEVEL: "DEBUG"
        run: ctest -C Release --output-on-failure --test-dir build -L live --timeout 600 --parallel 1

  iteration-lifecycle:
    name: 🔁 Iteration lifecycle
    needs: [integration, installation]
    # Preserve only this bounded resource lifecycle when the parent is cancelled.
    if: always() && inputs.run-iteration-test && needs.integration.result == 'success' && needs.installation.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: iqm-iteration-emerald-mock
      cancel-in-progress: false
      queue: max
    env:
      IQM_SERVER_URL: https://resonance.iqm.tech
      IQM_QC_ALIAS: emerald:mock
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      IQM_ITERATION_SCRATCH_FILE: ${{ runner.temp }}/iqm-iteration-ids.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ success() && !cancelled() }}
        with:
          persist-credentials: false
      - name: Install build dependencies
        if: ${{ success() && !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Configure standalone live target
        if: ${{ success() && !cancelled() }}
        run: cmake --preset release
      - name: Build
        id: build
        if: ${{ success() && !cancelled() }}
        run: cmake --build --preset release --target iteration_management_smoke
      - name: Create, inspect, and end without a device session
        if: always() && steps.build.outcome == 'success'
        env:
          CANCELLED_BEFORE_START: ${{ job.status == 'cancelled' }}
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
        run: |
          if [[ "$CANCELLED_BEFORE_START" == true ]]; then
            exit 0
          fi
          ./build/release/test/iteration/iteration_management_smoke
      - name: Reconcile confirmed IDs
        if: always()
        env:
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
        run: |
          if [[ -x ./build/release/test/iteration/iteration_management_smoke ]]; then
            ./build/release/test/iteration/iteration_management_smoke --cleanup-only
          elif [[ -s "$IQM_ITERATION_SCRATCH_FILE" ]]; then
            echo "Cleanup executable missing; confirmed iteration IDs need reconciliation"
            exit 1
          fi
