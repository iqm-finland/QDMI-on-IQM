name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-documentation:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl libcurl4-openssl-dev graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Doxygen
        uses: ssciwr/doxygen-install@b5b80f5a60852f72d3c33f47fee9ddfb84a25929 # v2.0.2
        with:
          version: "1.16.1"

      # `mqt-core` is pinned to a git reference, so it is built from source and
      # needs MLIR. Drop this once MQT Core v4 ships and the pin is a version.
      - name: Set up MLIR
        uses: munich-quantum-software/setup-mlir@fc08baf0a172e98008e6528d465de3b5dd99bc68 # v1.4.1
        with:
          llvm-version: 22.1.7

      # `docs/examples.md` shells out to the example scripts, which resolve
      # their own environment through `uv run --script`. While `mqt-core` is
      # pinned to a git reference, that resolution builds MQT Core from source
      # and exceeds the notebook cell timeout. Building it once here puts the
      # wheel in the uv cache, so the cell reuses it. Drop this once MQT Core v4
      # ships and the pin is a released version.
      - name: Warm the example script environments
        run: uv run --script examples/mqt_bench.py --help

      - name: Build documentation with nox
        run: uvx nox -s docs
        env:
          IQM_TOKEN: ${{ secrets.RESONANCE_API_KEY }}

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iqm-qdmi-device-docs
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-documentation
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
