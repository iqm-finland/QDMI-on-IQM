name: 🇨 • Tests • windows
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The Windows runner image to use. Defaults to 'windows-latest'.
          This can be any valid Windows runner image, such as 'windows-2022' or 'windows-2025'.
        default: "windows-latest"
        type: string
      config:
        description: >
          The build type to use. Defaults to 'Release'.
          This can be any valid CMake build type, such as 'Debug' or 'Release'.
        default: "Release"
        type: string
      compiler:
        description: >
          The Windows compiler toolset to use. Defaults to 'MSVC'.
          Supported values are 'MSVC' and 'ClangCL'.
        default: "MSVC"
        type: string
      iqm-qc-alias:
        description: >
          The alias of the IQM quantum computer to use for testing. Defaults to 'emerald:mock'.
          This can be any valid IQM quantum computer alias.
        default: "emerald:mock"
        type: string
    secrets:
      IQM_TOKEN:
        required: true

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  cpp-tests-windows:
    name: 🏁 ${{ inputs.runs-on }} ${{ inputs.compiler }} ${{ inputs.config }} ${{ inputs.iqm-qc-alias }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure CMake
        env:
          COMPILER: ${{ inputs.compiler }}
          CONFIG: ${{ inputs.config }}
        run: |
          $cmakeArguments = @("-S", ".", "-B", "build", "-DCMAKE_BUILD_TYPE=$env:CONFIG")
          if ($env:COMPILER -eq "ClangCL") {
            $cmakeArguments += @("-T", "ClangCL")
          } elseif ($env:COMPILER -ne "MSVC") {
            throw "Unsupported compiler: $env:COMPILER"
          }
          cmake @cmakeArguments
      - name: Build
        env:
          CONFIG: ${{ inputs.config }}
        run: cmake --build build --config $env:CONFIG --verbose
      - name: Test
        env:
          CONFIG: ${{ inputs.config }}
          IQM_BASE_URL: "https://resonance.iqm.tech"
          IQM_QC_ALIAS: ${{ inputs.iqm-qc-alias }}
          IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
          IQM_LOG_LEVEL: "DEBUG"
        run: ctest -C $env:CONFIG --output-on-failure --test-dir build --timeout 600 --repeat until-pass:3
