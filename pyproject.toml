[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=1.0.1" ]


[project]
name = "iqm-qdmi"
version = "1.4.0"
description = "Implementation of a QDMI device for IQM Quantum Computers"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]

[[project.authors]]
name = "IQM Finland Oy"
email = "developers@iqm.tech"

[project.optional-dependencies]
qiskit = [
  "mqt-core~=4.0.0",
  "numpy>=2.1; python_version>='3.13'",
  "numpy>=2.3.2; python_version>='3.14'",
  "qiskit[qasm3-import]>=2.1",
  "qiskit-algorithms>=0.4",
]

[project.urls]
Discussions = "https://github.com/iqm-finland/QDMI-on-IQM/discussions"
Documentation = "https://iqm-finland.github.io/QDMI-on-IQM/"
Homepage = "https://github.com/iqm-finland/QDMI-on-IQM"
Issues = "https://github.com/iqm-finland/QDMI-on-IQM/issues"

[project.scripts]
iqm-estimator = "iqm.qdmi.estimator:main"
iqm-qdmi = "iqm.qdmi.__main__:main"
iqm-sampler = "iqm.qdmi.sampler:main"

[project.entry-points]
# Lets any MQT Core QDMI backend over an IQM device submit IQM JSON.
"mqt.core.qiskit.program_serializers".IQM_JSON = "iqm.qdmi.serializers:qiskit_to_iqm_json"


[dependency-groups]
dev = [
  { include-group = "test" },
  "nox>=2026.4.10",
]
test = [
  "pytest>=9.0.1",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
  { include-group = "qiskit" },
]
docs = [
  "breathe>=4.36",
  "furo>=2025.12.19",
  "myst-nb>=1.4",
  "sphinx>=9",
  "sphinx-autoapi>=3.6.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=1",
]
qiskit = [
  "mqt-core~=4.0.0",
  "numpy>=2.1",
  "qiskit[qasm3-import]>=2.1",
  "qiskit-algorithms>=0.4",
]


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{build_type}"

[tool.scikit-build.build]
targets = [ "iqm-qdmi-device" ]

[tool.scikit-build.cmake]
version = "CMakeLists.txt"

[tool.scikit-build.cmake.define]
BUILD_IQM_QDMI_TESTS = "OFF"

[tool.scikit-build.ninja]
make-fallback = true

[tool.scikit-build.sdist]
exclude = [
  "**/docs",
  "**/test",
  "spank/**",
  "sitecustomize.py",
  ".*",
]
include = [ "python/iqm/qdmi/_version.py" ]

[tool.scikit-build.wheel]
expand-macos-universal-tags = true
install-dir = "iqm/qdmi/data"
packages = [ "python/iqm" ]
py-api = "py311"

[tool.scikit-build.install]
components = [ "iqm-qdmi-device_Runtime", "iqm-qdmi-device_Development" ]

[[tool.scikit-build.generate]]
path = "iqm/qdmi/_version.py"
template = '''
version = "${version}"
'''

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
cmake.define.CMAKE_IGNORE_PATH = "/opt/homebrew;/usr/local"
cmake.define.CPR_USE_SYSTEM_CURL = "ON"


[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "src/**/*" },
]

[tool.uv.sources]
iqm-qdmi = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
test-skip = [
  "cp3??t-*",      # no freethreading qiskit wheels
  "cp*-win_arm64", # no numpy, qiskit, ... wheels
  "*-musllinux_*", # no musllinux wheels for qiskit and dependencies
  "cp315*",        # no 3.15 wheels yet
]
archs = "auto64"
build-frontend = "uv"
environment-pass = [
  "IQM_BASE_URL",
  "IQM_QC_ALIAS",
  "IQM_TOKEN",
  "IQM_LOG_LEVEL",
  "IQM_CPP_API_LOG_LEVEL",
]
test-command = "pytest test/python"
test-groups = [ "test" ]
test-sources = [ "test/python" ]
overrides = [ { select = "*-musllinux*", before-all = "apk add openssl-dev" } ]

[tool.cibuildwheel.linux]
before-all = "yum install -y openssl-devel"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg iqm"


[tool.ruff]
line-length = 120
namespace-packages = [ "iqm" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "TID252"  # Prefer absolute imports over relative imports from parent modules
]
per-file-ignores."docs/**" = [ "INP001", "T20" ]
per-file-ignores."examples/**" = [ "INP001", "T20" ]
per-file-ignores."python/iqm/qdmi/__init__.py" = [ "RUF067" ]
per-file-ignores."python/iqm/qdmi/__main__.py" = [ "T201" ]
per-file-ignores."python/iqm/qdmi/estimator.py" = [ "T201" ]
per-file-ignores."python/iqm/qdmi/offloader.py" = [ "PLW0717" ]
per-file-ignores."python/iqm/qdmi/sampler.py" = [ "T201" ]
per-file-ignores."test/python/**" = [ "INP001", "T20" ]
isort.known-first-party = [ "iqm.qdmi" ]
pydocstyle.convention = "google"
future-annotations = true


[tool.repo-review]

[tool.repo-review.ignore]
GH200 = "We use Renovate instead of Dependabot"
PC160 = "We use a mirror of crate-ci/typos"
PC170 = "We do not use rST files"


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # ignore line
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # ignore block
  "FoMaC"
]

[tool.typos.default.extend-words]
optin = "optin"
recal = "recal"
delocate = "delocate"


[tool.ty]

[tool.ty.terminal]
# Warnings are not surfaced by the exit code unless this is set, so `ty` findings
# below error level would otherwise pass CI unnoticed.
error-on-warning = true

[tool.ty.analysis]
# The following packages are solely used in the end-to-end demonstrations and are not required for the core functionality of the library.
# To avoid limiting the usability of the core library, we purposely do not add these packages as dependencies.
# As a consequence, we need to ignore the unresolved imports from these packages in the type analysis.
allowed-unresolved-imports = [ "mqt.bench.**", "qiskit_nature.**", "qiskit_algorithms.**", "pyscf.**" ]


[tool.pytest]
addopts = [
  "-ra",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
  # SciPy solver deprecation
  "ignore:.*The `disp` and `iprint` options of the L-BFGS-B solver are deprecated.*:DeprecationWarning:",
  # SciPy OptimizeWarning for unknown options
  "ignore:.*Unknown solver options.*::",
  # UserWarning for unmapped operations
  "ignore:.*Device operation 'prx_12' cannot be mapped to a Qiskit gate and will be skipped.*:UserWarning:",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "test/python" ]


[tool.coverage]

[tool.coverage.run]
source = [ "iqm.qdmi" ]
parallel = true
disable_warnings = [
  "no-sysmon",
]
core = "sysmon"

[tool.coverage.report]
exclude_also = [
  "@overload",                 # Overloads are only for static typing
  '\.\.\.',
  "def __dir__()",             # Ignore __dir__ method that exists mainly for better IDE support
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError"
]
